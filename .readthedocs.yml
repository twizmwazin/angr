# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2
sphinx:
  configuration: docs/conf.py
formats: [pdf]
python:
  install:
    - method: uv
      command: sync
      extras: all
      groups: [docs]
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: latest
  jobs:
    build:
      html:
        # Read the Docs' default HTML command plus ``-j auto``. The PDF build
        # that follows reads the same doctrees directory.
        - uv run --no-sync --no-dev sphinx-build -j auto -T -b html -d docs/_build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html
