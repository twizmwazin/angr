name: CI

on:
  push:
    branches: [claude/nice-edison-d26f0f]

jobs:
  ice:
    name: Locate MSVC ICE (temporary)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - shell: bash
        run: |
          git -c core.autocrlf=false clone https://github.com/angr/pyvex.git pv
          cd pv
          git checkout 6a81d15f490795522aeebb7e1786bb60c5ca2ec1
          git -c core.autocrlf=false submodule update --init --recursive
          cl //nologo //DAVX_512 //Ivex/pub vex/auxprogs/genoffsets.c //Fegenoffsets.exe
          ./genoffsets.exe > vex/pub/libvex_guest_offsets.h
          mkdir -p pyvex/include && cp pyvex_c/pyvex.h pyvex/include/
          python ../.github/ice_bisect.py
          rm -f vex/priv/guest_s390__v.c vex/pub/libvex_guest_offsets.h genoffsets.* tmp.obj
          rm -rf pyvex/include
          git status --short
          git apply --ignore-whitespace ../.github/pyvex-msvc.patch
          git diff --stat
          python -m venv ../venv
          ../venv/Scripts/python -m pip install -q git+https://github.com/angr/archinfo.git
          ../venv/Scripts/python -m pip install -v . 2>&1 | grep -E "compiler identification|guest_s390_toIR|bad size|error|Successfully" | head -40
          cd ..
          venv/Scripts/python -c "
          import pyvex, archinfo
          print(pyvex.__version__)
          pyvex.lift(bytes.fromhex('4889d8c3'), 0x1000, archinfo.ArchAMD64()).pp()
          # EX r1,0(r2) then BR r14
          pyvex.lift(bytes.fromhex('4410200007fe'), 0x1000, archinfo.ArchS390X()).pp()
          print('LIFT OK')
          "
