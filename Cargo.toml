[workspace]
resolver = "3"
members = [
    "native/angr",
    "native/clarirs-core",
    "native/clarirs-num",
    "native/clarirs-smtrs",
    "native/clarirs-vsa",
    "native/clarirs-z3",
]
# The extension solves with `clarirs-smtrs`. `clarirs-z3` stays buildable as
# a differential oracle (`cargo test -p clarirs-z3`) but needs libz3, so it is
# left out of the default build and test set.
default-members = [
    "native/angr",
    "native/clarirs-core",
    "native/clarirs-num",
    "native/clarirs-smtrs",
    "native/clarirs-vsa",
]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

[workspace.package]
license = "BSD-2-Clause"
readme = "README.md"
keywords = [
    "analysis",
    "angr",
    "binary",
    "decompiler",
    "emulator",
    "engineering",
    "execution",
    "research",
    "reverse",
    "security",
    "symbolic",
    "vulnerability",
]
categories = ["science", "security"]
repository = "https://github.com/angr/angr.git"

[workspace.lints.clippy]
all = "warn"
cargo = "warn"
