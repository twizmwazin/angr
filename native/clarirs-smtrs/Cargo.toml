[package]
name = "clarirs-smtrs"
version = "0.1.0"
edition = "2024"
description = "smtrs solver backend for clarirs"
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
repository = { workspace = true }

[dependencies]
clarirs-core = { path = "../clarirs-core" }
# Pure-Rust SMT solver built for angr's query shape. `smtrs-solver` is built
# without its `batsat` differential-testing backend, which is the one part of
# the stack that is not `Send`.
smtrs-core = { git = "https://github.com/twizmwazin/smtrs.git", rev = "97ebd2505d2ea9121efb6ec82f2c9e1adf741e12" }
smtrs-solver = { git = "https://github.com/twizmwazin/smtrs.git", rev = "97ebd2505d2ea9121efb6ec82f2c9e1adf741e12", default-features = false }
smtrs-fp = { git = "https://github.com/twizmwazin/smtrs.git", rev = "97ebd2505d2ea9121efb6ec82f2c9e1adf741e12" }
smtrs-str = { git = "https://github.com/twizmwazin/smtrs.git", rev = "97ebd2505d2ea9121efb6ec82f2c9e1adf741e12" }
rustc-hash = "2"
smallvec = "1.15"
num-bigint = "0.4"

[lints]
workspace = true
