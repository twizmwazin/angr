[package]
name = "clarirs-smtrs"
version = "0.1.0"
edition = "2024"
description = "smtrs solver backend for clarirs"
license = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
repository = { workspace = true }

[dependencies]
clarirs-core = { path = "../clarirs-core" }
# Pure-Rust SMT solver built for angr's query shape, pinned to smtrs `main`
# with the whole embedding series merged.
smtrs-core = { git = "https://github.com/twizmwazin/smtrs.git", rev = "a565e2acb6805d81e5f5ba0be527e3ee802035e0" }
smtrs-solver = { git = "https://github.com/twizmwazin/smtrs.git", rev = "a565e2acb6805d81e5f5ba0be527e3ee802035e0" }
smtrs-fp = { git = "https://github.com/twizmwazin/smtrs.git", rev = "a565e2acb6805d81e5f5ba0be527e3ee802035e0" }
smtrs-str = { git = "https://github.com/twizmwazin/smtrs.git", rev = "a565e2acb6805d81e5f5ba0be527e3ee802035e0" }
rustc-hash = "2"
smallvec = "1.15"
num-bigint = "0.4"

[lints]
workspace = true
